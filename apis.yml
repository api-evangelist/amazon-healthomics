- type: Features
  data:
  - name: Omics Storage
    description: Purpose-built storage for genomic, transcriptomic, and other omics
      data with automatic optimization.
  - name: Bioinformatics Workflows
    description: Run industry-standard bioinformatics tools and pipelines using WDL
      and Nextflow workflow definitions.
  - name: Annotation Stores
    description: Store and query genomic annotation data from sources like ClinVar,
      Ensembl, and custom datasets.
  - name: Variant Stores
    description: Store and query genomic variant data in VCF and other standard bioinformatics
      formats.
  - name: Sequence Stores
    description: Efficiently store and retrieve genomic sequence read sets in FASTQ,
      BAM, and CRAM formats.
  - name: Reference Genomes
    description: Store and access reference genome files for alignment and analysis
      workflows.
  - name: Managed Compute
    description: Fully managed compute infrastructure for running bioinformatics workflows
      at scale.
- type: UseCases
  data:
  - name: Whole Genome Sequencing
    description: Store, analyze, and interpret whole genome sequencing data for research
      and clinical applications.
  - name: Variant Calling Pipelines
    description: Run standard variant calling workflows on genomic data to identify
      genetic variants.
  - name: Pharmacogenomics Research
    description: Analyze genomic data to understand drug response and develop personalized
      medicine approaches.
  - name: Population Genomics
    description: Process and analyze large-scale genomic datasets across patient populations
      for research.
  - name: Clinical Genomics
    description: Support clinical genomics workflows for diagnosis and treatment of
      genetic disorders.
- type: Integrations
  data:
  - name: Amazon S3
    description: Import and export omics data using S3 as the primary data source
      and destination.
  - name: AWS IAM
    description: Control access to HealthOmics resources using IAM roles and policies.
  - name: Amazon CloudWatch
    description: Monitor HealthOmics workflows and storage operations through CloudWatch
      metrics.
  - name: AWS Lake Formation
    description: Govern and secure genomic data lake access using Lake Formation permissions.
  - name: Amazon Athena
    description: Query genomic annotation and variant data stored in HealthOmics using
      Athena.
  - name: AWS Batch
    description: Supplement HealthOmics workflows with custom compute jobs using AWS
      Batch.
