                $ref: '#/components/schemas/ServiceQuotaExceededException'
        '483':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '484':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '485':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '486':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '487':
          description: RequestTimeoutException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeoutException'
      parameters:
      - name: sequenceStoreId
        in: path
        required: true
        description: ' The sequence store ID for the store that is the destination of the multipart uploads. '
        schema:
          type: string
          pattern: '[0-9]+'
          minLength: 10
          maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - sourceFileType
              - subjectId
              - sampleId
              - referenceArn
              - name
              properties:
                clientToken:
                  description: ' An idempotency token that can be used to avoid triggering multiple multipart uploads. '
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 127
                sourceFileType:
                  description: ' The type of file being uploaded. '
                  type: string
                  enum:
                  - FASTQ
                  - BAM
                  - CRAM
                subjectId:
                  description: ' The source''s subject ID. '
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 127
                sampleId:
                  description: ' The source''s sample ID. '
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 127
                generatedFrom:
                  description: ' Where the source originated. '
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 127
                referenceArn:
                  description: ' The ARN of the reference. '
                  type: string
                  pattern: arn:.+
                  minLength: 1
                  maxLength: 127
                name:
                  description: ' The name of the read set. '
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 127
                description:
                  description: ' The description of the read set. '
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 255
                tags:
                  description: ' Any tags to add to the read set. '
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/TagValue'
      summary: Amazon HealthOmics Create Multipart Read Set Upload
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Sequencestore
  /sequencestore:
