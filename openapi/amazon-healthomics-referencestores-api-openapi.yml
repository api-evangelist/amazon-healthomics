security:
- hmac: []
tags:
- name: Referencestores
paths:
  /referencestores:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListReferenceStores
      description: Retrieves a list of reference stores.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReferenceStoresResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '483':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '484':
          description: RequestTimeoutException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeoutException'
      parameters:
      - name: maxResults
        in: query
        required: false
        description: The maximum number of stores to return in one page of results.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: nextToken
        in: query
        required: false
        description: Specify the pagination token from a previous request to retrieve the next page of results.
        schema:
          type: string
          pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
          minLength: 1
          maxLength: 6144
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  description: A filter for reference stores.
                  type: object
                  properties:
                    name:
                      allOf:
                      - $ref: '#/components/schemas/ReferenceStoreName'
                      - description: The name to filter on.
                    createdAfter:
                      allOf:
                      - $ref: '#/components/schemas/SyntheticTimestamp_date_time'
                      - description: The filter's start date.
                    createdBefore:
                      allOf:
                      - $ref: '#/components/schemas/SyntheticTimestamp_date_time'
                      - description: The filter's end date.
      summary: Amazon HealthOmics List Reference Stores
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Referencestores
components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    NextToken:
      type: string
      pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
      minLength: 1
      maxLength: 6144
    SyntheticTimestamp_date_time:
      type: string
      format: date-time
    ReferenceStoreDetail:
      type: object
      required:
      - arn
      - id
      - creationTime
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/ReferenceStoreArn'
          - description: The store's ARN.
        id:
          allOf:
          - $ref: '#/components/schemas/ReferenceStoreId'
          - description: The store's ID.
        name:
          allOf:
          - $ref: '#/components/schemas/ReferenceStoreName'
          - description: The store's name.
        description:
          allOf:
          - $ref: '#/components/schemas/ReferenceStoreDescription'
          - description: The store's description.
        sseConfig:
          allOf:
          - $ref: '#/components/schemas/SseConfig'
          - description: The store's server-side encryption (SSE) settings.
        creationTime:
          allOf:
          - $ref: '#/components/schemas/SyntheticTimestamp_date_time'
          - description: When the store was created.
      description: Details about a reference store.
    RequestTimeoutException: {}
    ThrottlingException: {}
    ReferenceStoreArn:
      type: string
      pattern: arn:.+
      minLength: 1
      maxLength: 127
    ReferenceStoreName:
      type: string
      pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
      minLength: 1
      maxLength: 127
    EncryptionType:
      type: string
      enum:
      - KMS
    SseConfig:
      type: object
      required:
      - type
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/EncryptionType'
          - description: The encryption type.
        keyArn:
          allOf:
          - $ref: '#/components/schemas/SseConfigKeyArnString'
          - description: An encryption key ARN.
      description: Server-side encryption (SSE) settings for a store.
    ReferenceStoreDetailList:
      type: array
      items:
        $ref: '#/components/schemas/ReferenceStoreDetail'
    ValidationException: {}
    ReferenceStoreId:
      type: string
      pattern: '[0-9]+'
      minLength: 10
      maxLength: 36
    SseConfigKeyArnString:
      type: string
      pattern: '.*arn:([^: ]*):([^: ]*):([^: ]*):([0-9]{12}):([^: ]*).*'
      minLength: 20
      maxLength: 2048
    ListReferenceStoresResponse:
      type: object
      required:
      - referenceStores
      properties:
        nextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: A pagination token that's included if more results are available.
        referenceStores:
          allOf:
          - $ref: '#/components/schemas/ReferenceStoreDetailList'
          - description: A list of reference stores.
    ReferenceStoreDescription:
      type: string
      pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
      minLength: 1
      maxLength: 255
    AccessDeniedException: {}
    InternalServerException: {}
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/omics/
x-hasEquivalentPaths: true
