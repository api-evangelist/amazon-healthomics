        '486':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '487':
          description: RequestTimeoutException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeoutException'
      parameters:
      - name: id
        in: path
        required: true
        description: The task's ID.
        schema:
          type: string
          pattern: '[0-9]+'
          minLength: 1
          maxLength: 18
      - name: taskId
        in: path
        required: true
        description: The task's ID.
        schema:
          type: string
          pattern: '[0-9]+'
          minLength: 1
          maxLength: 18
      summary: Amazon HealthOmics Get Run Task
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Run
  /run/{id}/task:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: ListRunTasks
      description: Retrieves a list of tasks for a run.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunTasksResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ServiceQuotaExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceQuotaExceededException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '484':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
        '485':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '486':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '487':
          description: RequestTimeoutException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeoutException'
      parameters:
      - name: id
        in: path
        required: true
        description: The run's ID.
        schema:
          type: string
          pattern: '[0-9]+'
          minLength: 1
          maxLength: 18
      - name: status
        in: query
        required: false
        description: Filter the list by status.
        schema:
          type: string
          enum:
          - PENDING
          - STARTING
          - RUNNING
          - STOPPING
          - COMPLETED
          - CANCELLED
          - FAILED
          minLength: 1
          maxLength: 64
      - name: startingToken
        in: query
        required: false
        description: Specify the pagination token from a previous request to retrieve the next page of results.
        schema:
          type: string
          pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
          minLength: 1
          maxLength: 128
      - name: maxResults
        in: query
        required: false
        description: The maximum number of run tasks to return in one page of results.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      summary: Amazon HealthOmics List Run Tasks
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Run
  /run:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: ListRuns
      description: Retrieves a list of runs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunsResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ServiceQuotaExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceQuotaExceededException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '484':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
        '485':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '486':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '487':
          description: RequestTimeoutException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeoutException'
      parameters:
      - name: name
        in: query
        required: false
        description: Filter the list by run name.
        schema:
          type: string
          pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
          minLength: 1
          maxLength: 128
      - name: runGroupId
        in: query
        required: false
        description: Filter the list by run group ID.
        schema:
          type: string
          pattern: '[0-9]+'
          minLength: 1
          maxLength: 18
      - name: startingToken
        in: query
        required: false
        description: Specify the pagination token from a previous request to retrieve the next page of results.
        schema:
          type: string
          pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
          minLength: 1
          maxLength: 128
      - name: maxResults
        in: query
        required: false
        description: The maximum number of runs to return in one page of results.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: status
        in: query
        required: false
        description: ' The status of a run. '
        schema:
          type: string
          enum:
          - PENDING
          - STARTING
          - RUNNING
          - STOPPING
          - COMPLETED
          - DELETED
          - CANCELLED
          - FAILED
          minLength: 1
          maxLength: 64
      summary: Amazon HealthOmics List Runs
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Run
    post:
      operationId: StartRun
      description: Starts a run.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartRunResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ServiceQuotaExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceQuotaExceededException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '484':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
        '485':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '486':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '487':
          description: RequestTimeoutException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeoutException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - roleArn
              - requestId
              properties:
                workflowId:
                  description: The run's workflow ID.
                  type: string
                  pattern: '[0-9]+'
                  minLength: 1
                  maxLength: 18
                workflowType:
                  description: The run's workflows type.
                  type: string
                  enum:
                  - PRIVATE
                  - READY2RUN
                  minLength: 1
                  maxLength: 64
                runId:
                  description: The run's ID.
                  type: string
                  pattern: '[0-9]+'
                  minLength: 1
                  maxLength: 18
                roleArn:
                  description: A service role for the run.
                  type: string
                  pattern: arn:.+
                  minLength: 1
                  maxLength: 128
                name:
                  description: A name for the run.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 128
                runGroupId:
                  description: The run's group ID.
                  type: string
                  pattern: '[0-9]+'
                  minLength: 1
                  maxLength: 18
                priority:
                  description: A priority for the run.
                  type: integer
                  minimum: 0
                  maximum: 100000
                parameters:
                  description: Parameters for the run.
                  type: object
                  properties: {}
                storageCapacity:
                  description: A storage capacity for the run in gigabytes.
                  type: integer
                  minimum: 0
                  maximum: 100000
                outputUri:
                  description: An output URI for the run.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 128
                logLevel:
                  description: A log level for the run.
                  type: string
                  enum:
                  - 'OFF'
                  - FATAL
                  - ERROR
                  - ALL
                  minLength: 1
                  maxLength: 64
                tags:
                  description: Tags for the run.
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/TagValue'
                requestId:
                  description: To ensure that requests don't run multiple times, specify a unique ID for each request.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 128
      summary: Amazon HealthOmics Start Run
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Run
components:
  schemas:
    ConflictException: {}
    GetRunTaskResponseMemoryInteger:
      type: integer
      minimum: 1
    TaskId:
      type: string
      pattern: '[0-9]+'
      minLength: 1
      maxLength: 18
    TaskTimestamp:
      type: string
      format: date-time
    RunLogLevel:
      type: string
      enum:
      - 'OFF'
      - FATAL
      - ERROR
      - ALL
      minLength: 1
      maxLength: 64
    WorkflowDefinition:
      type: string
      pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
      minLength: 1
      maxLength: 256
    GetRunResponseStorageCapacityInteger:
      type: integer
      minimum: 0
      maximum: 100000
    GetRunTaskResponseGpusInteger:
      type: integer
      minimum: 0
    RunId:
      type: string
      pattern: '[0-9]+'
      minLength: 1
      maxLength: 18
    RunParameters:
      type: object
      properties: {}
    TaskListToken:
      type: string
      pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
      minLength: 1
      maxLength: 128
    TaskLogStream:
      type: string
      pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
    ListRunsResponse:
      type: object
      properties:
        items:
          allOf:
          - $ref: '#/components/schemas/RunList'
          - description: A list of runs.
        nextToken:
          allOf:
          - $ref: '#/components/schemas/RunListToken'
          - description: A pagination token that's included if more results are available.
    RunListItemPriorityInteger:
      type: integer
      minimum: 0
      maximum: 100000
    RunListItem:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/RunArn'
          - description: The run's ARN.
        id:
