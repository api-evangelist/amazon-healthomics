components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  schemas:
    ResourceNotFoundException: {}
    WorkflowParameterTemplate:
      type: object
      minProperties: 1
      maxProperties: 1000
      additionalProperties:
        $ref: '#/components/schemas/WorkflowParameter'
    WorkflowList:
      type: array
      items:
        $ref: '#/components/schemas/WorkflowListItem'
    WorkflowParameter:
      type: object
      properties:
        description:
          allOf:
          - $ref: '#/components/schemas/WorkflowParameterDescription'
          - description: The parameter's description.
        optional:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: Whether the parameter is optional.
      description: A workflow parameter.
    WorkflowId:
      type: string
      pattern: '[0-9]+'
      minLength: 1
      maxLength: 18
    WorkflowMetadata:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/WorkflowMetadataValue'
    WorkflowListItem:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/WorkflowArn'
          - description: The workflow's ARN.
        id:
          allOf:
          - $ref: '#/components/schemas/WorkflowId'
          - description: The workflow's ID.
        name:
          allOf:
          - $ref: '#/components/schemas/WorkflowName'
          - description: The workflow's name.
        status:
          allOf:
          - $ref: '#/components/schemas/WorkflowStatus'
          - description: The workflow's status.
        type:
          allOf:
          - $ref: '#/components/schemas/WorkflowType'
          - description: The workflow's type.
        digest:
          allOf:
          - $ref: '#/components/schemas/WorkflowDigest'
          - description: The workflow's digest.
        creationTime:
          allOf:
          - $ref: '#/components/schemas/WorkflowTimestamp'
          - description: When the workflow was created.
        metadata:
          allOf:
          - $ref: '#/components/schemas/WorkflowMetadata'
          - description: ' Any metadata available for workflow. The information listed may vary depending on the workflow, and there may also be no metadata to return. '
      description: A workflow.
    WorkflowEngine:
      type: string
      enum:
      - WDL
      - NEXTFLOW
      - CWL
      minLength: 1
      maxLength: 64
    WorkflowTimestamp:
      type: string
      format: date-time
    WorkflowStatus:
      type: string
      enum:
      - CREATING
      - ACTIVE
      - UPDATING
      - DELETED
      - FAILED
      - INACTIVE
      minLength: 1
      maxLength: 64
    ConflictException: {}
    WorkflowName:
      type: string
      pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
      minLength: 1
      maxLength: 128
    WorkflowType:
      type: string
      enum:
      - PRIVATE
      - READY2RUN
      minLength: 1
      maxLength: 64
    WorkflowStatusMessage:
      type: string
      pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
    WorkflowParameterDescription:
      type: string
      pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
      minLength: 0
      maxLength: 256
    CreateWorkflowResponse:
      type: object
      properties:
