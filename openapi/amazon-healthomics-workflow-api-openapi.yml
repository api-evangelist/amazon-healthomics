        '486':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '487':
          description: RequestTimeoutException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeoutException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - requestId
              properties:
                name:
                  description: A name for the workflow.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 128
                description:
                  description: A description for the workflow.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 256
                engine:
                  description: An engine for the workflow.
                  type: string
                  enum:
                  - WDL
                  - NEXTFLOW
                  - CWL
                  minLength: 1
                  maxLength: 64
                definitionZip:
                  description: A ZIP archive for the workflow.
                  type: string
                definitionUri:
                  description: The URI of a definition for the workflow.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 256
                main:
                  description: The path of the main definition file for the workflow.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 128
                parameterTemplate:
                  description: A parameter template for the workflow.
                  type: object
                  minProperties: 1
                  maxProperties: 1000
                  additionalProperties:
                    $ref: '#/components/schemas/WorkflowParameter'
                storageCapacity:
                  description: A storage capacity for the workflow in gigabytes.
                  type: integer
                  minimum: 0
                  maximum: 100000
                tags:
                  description: Tags for the workflow.
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/TagValue'
                requestId:
                  description: To ensure that requests don't run multiple times, specify a unique ID for each request.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 128
                accelerators:
                  description: ' The computational accelerator specified to run the workflow. '
                  type: string
                  enum:
                  - GPU
                  minLength: 1
                  maxLength: 64
      summary: Amazon HealthOmics Create Workflow
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Workflow
    get:
      operationId: ListWorkflows
      description: Retrieves a list of workflows.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowsResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ServiceQuotaExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceQuotaExceededException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '484':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
        '485':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '486':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '487':
          description: RequestTimeoutException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeoutException'
      parameters:
      - name: type
        in: query
        required: false
        description: The workflows' type.
        schema:
          type: string
          enum:
          - PRIVATE
          - READY2RUN
          minLength: 1
          maxLength: 64
      - name: name
        in: query
        required: false
        description: The workflows' name.
        schema:
          type: string
          pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
          minLength: 1
          maxLength: 128
      - name: startingToken
        in: query
        required: false
        description: Specify the pagination token from a previous request to retrieve the next page of results.
        schema:
          type: string
          pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
          minLength: 1
          maxLength: 128
      - name: maxResults
        in: query
        required: false
        description: The maximum number of workflows to return in one page of results.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      summary: Amazon HealthOmics List Workflows
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Workflow
