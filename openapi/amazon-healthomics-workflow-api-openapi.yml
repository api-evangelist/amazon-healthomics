    WorkflowDefinition:
      type: string
      pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
      minLength: 1
      maxLength: 256
    TagValue:
      type: string
      minLength: 0
      maxLength: 256
    RequestTimeoutException: {}
    WorkflowArn:
      type: string
      pattern: arn:.+
      minLength: 1
      maxLength: 128
    ThrottlingException: {}
    WorkflowDigest:
      type: string
      minLength: 1
      maxLength: 64
    ListWorkflowsResponse:
