                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 128
                maxGpus:
                  description: ' The maximum GPUs that can be used by a run group. '
                  type: integer
                  minimum: 1
                  maximum: 100000
