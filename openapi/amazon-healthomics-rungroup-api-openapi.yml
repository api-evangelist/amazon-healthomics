      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - requestId
              properties:
                name:
                  description: A name for the group.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 128
                maxCpus:
                  description: The maximum number of CPUs to use in the group.
                  type: integer
                  minimum: 1
                  maximum: 100000
                maxRuns:
                  description: The maximum number of concurrent runs for the group.
                  type: integer
                  minimum: 1
                  maximum: 100000
                maxDuration:
                  description: A maximum run time for the group in minutes.
                  type: integer
                  minimum: 1
                  maximum: 100000
                tags:
                  description: Tags for the group.
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/TagValue'
                requestId:
