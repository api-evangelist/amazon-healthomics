        '487':
          description: RequestTimeoutException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeoutException'
      parameters:
      - name: name
        in: query
        required: false
        description: The run groups' name.
        schema:
          type: string
          pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
          minLength: 1
          maxLength: 128
      - name: startingToken
