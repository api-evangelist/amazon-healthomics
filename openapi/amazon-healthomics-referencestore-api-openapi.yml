      operationId: CreateReferenceStore
      description: Creates a reference store.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReferenceStoreResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ServiceQuotaExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceQuotaExceededException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '484':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '485':
          description: RequestTimeoutException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTimeoutException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  description: A name for the store.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 127
                description:
                  description: A description for the store.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 255
                sseConfig:
                  description: Server-side encryption (SSE) settings for a store.
                  type: object
                  properties:
                    type:
                      allOf:
                      - $ref: '#/components/schemas/EncryptionType'
                      - description: The encryption type.
                    keyArn:
                      allOf:
                      - $ref: '#/components/schemas/SseConfigKeyArnString'
                      - description: An encryption key ARN.
                tags:
                  description: Tags for the store.
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/TagValue'
                clientToken:
                  description: To ensure that requests don't run multiple times, specify a unique token for each request.
                  type: string
                  pattern: '[\p{L}||\p{M}||\p{Z}||\p{S}||\p{N}||\p{P}]+'
                  minLength: 1
                  maxLength: 127
      summary: Amazon HealthOmics Create Reference Store
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Referencestore
