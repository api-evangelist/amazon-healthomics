        '484':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      parameters:
      - name: jobId
        in: path
        required: true
        description: The job's ID.
        schema:
          type: string
          pattern: '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'
      summary: Amazon HealthOmics Cancel Variant Import Job
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Import
    get:
      operationId: GetVariantImportJob
      description: Gets information about a variant import job.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVariantImportResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '484':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      parameters:
      - name: jobId
        in: path
        required: true
        description: The job's ID.
        schema:
          type: string
          pattern: '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'
      summary: Amazon HealthOmics Get Variant Import Job
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Import
  /import/annotations:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListAnnotationImportJobs
      description: Retrieves a list of annotation import jobs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAnnotationImportJobsResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '484':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      parameters:
      - name: maxResults
        in: query
        required: false
        description: The maximum number of jobs to return in one page of results.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: nextToken
        in: query
        required: false
        description: Specify the pagination token from a previous request to retrieve the next page of results.
        schema:
          type: string
          minLength: 1
          maxLength: 10000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  description: IDs of annotation import jobs to retrieve.
                  type: array
                  items:
                    $ref: '#/components/schemas/ResourceIdentifier'
                  minItems: 1
                  maxItems: 20
                filter:
                  description: A filter for annotation import jobs.
                  type: object
                  properties:
                    status:
                      allOf:
                      - $ref: '#/components/schemas/JobStatus'
                      - description: A status to filter on.
                    storeName:
                      allOf:
                      - $ref: '#/components/schemas/String'
                      - description: A store name to filter on.
      summary: Amazon HealthOmics List Annotation Import Jobs
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Import
  /import/variants:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListVariantImportJobs
      description: Retrieves a list of variant import jobs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVariantImportJobsResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '484':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      parameters:
      - name: maxResults
        in: query
        required: false
        description: The maximum number of import jobs to return in one page of results.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: nextToken
        in: query
        required: false
        description: Specify the pagination token from a previous request to retrieve the next page of results.
        schema:
          type: string
          minLength: 1
          maxLength: 10000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  description: A list of job IDs.
                  type: array
                  items:
                    $ref: '#/components/schemas/ResourceIdentifier'
                  minItems: 1
                  maxItems: 20
                filter:
                  description: A filter for variant import jobs.
                  type: object
                  properties:
                    status:
                      allOf:
                      - $ref: '#/components/schemas/JobStatus'
                      - description: A status to filter on.
                    storeName:
                      allOf:
                      - $ref: '#/components/schemas/String'
                      - description: A store name to filter on.
      summary: Amazon HealthOmics List Variant Import Jobs
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Import
  /import/annotation:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: StartAnnotationImportJob
      description: Starts an annotation import job.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAnnotationImportResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ServiceQuotaExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceQuotaExceededException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '484':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '485':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - destinationName
              - roleArn
              - items
              properties:
                destinationName:
                  description: A destination annotation store for the job.
                  type: string
                  pattern: ([a-z]){1}([a-z0-9_]){2,254}
                  minLength: 3
                  maxLength: 255
                roleArn:
                  description: A service role for the job.
                  type: string
                  pattern: 'arn:([^: ]*):([^: ]*):([^: ]*):([0-9]{12}):([^: ]*)'
                  minLength: 20
                  maxLength: 2048
                items:
                  description: Items to import.
                  type: array
                  items:
                    $ref: '#/components/schemas/AnnotationImportItemSource'
                  minItems: 1
                formatOptions:
                  description: Formatting options for a file.
                  type: object
                  properties:
                    tsvOptions:
                      allOf:
                      - $ref: '#/components/schemas/TsvOptions'
                      - description: Options for a TSV file.
                    vcfOptions:
                      allOf:
                      - $ref: '#/components/schemas/VcfOptions'
                      - description: Options for a VCF file.
                runLeftNormalization:
                  description: The job's left normalization setting.
                  type: boolean
                annotationFields:
                  description: ' The annotation schema generated by the parsed annotation data. '
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/AnnotationFieldMapValueString'
      summary: Amazon HealthOmics Start Annotation Import Job
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Import
  /import/variant:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: StartVariantImportJob
      description: Starts a variant import job.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartVariantImportResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ServiceQuotaExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceQuotaExceededException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '484':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '485':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - destinationName
              - roleArn
              - items
              properties:
                destinationName:
                  description: The destination variant store for the job.
                  type: string
                  pattern: ([a-z]){1}([a-z0-9_]){2,254}
                  minLength: 3
                  maxLength: 255
                roleArn:
                  description: A service role for the job.
                  type: string
                  pattern: 'arn:([^: ]*):([^: ]*):([^: ]*):([0-9]{12}):([^: ]*)'
                  minLength: 20
                  maxLength: 2048
                items:
                  description: Items to import.
                  type: array
                  items:
                    $ref: '#/components/schemas/VariantImportItemSource'
                  minItems: 1
                runLeftNormalization:
                  description: The job's left normalization setting.
                  type: boolean
                annotationFields:
                  description: ' The annotation schema generated by the parsed annotation data. '
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/AnnotationFieldMapValueString'
      summary: Amazon HealthOmics Start Variant Import Job
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Import
components:
  schemas:
    JobStatusMsg:
      type: string
    AnnotationImportItemDetails:
      type: array
      items:
        $ref: '#/components/schemas/AnnotationImportItemDetail'
      minItems: 1
      maxItems: 1
    VariantImportItemDetail:
      type: object
      required:
      - source
      - jobStatus
      properties:
        source:
          allOf:
          - $ref: '#/components/schemas/S3Uri'
          - description: The source file's location in Amazon S3.
        jobStatus:
          allOf:
          - $ref: '#/components/schemas/JobStatus'
          - description: The item's job status.
        statusMessage:
          allOf:
          - $ref: '#/components/schemas/JobStatusMsg'
          - description: ' A message that provides additional context about a job '
      description: Details about an imported variant item.
    StartAnnotationImportResponse:
      type: object
      required:
      - jobId
      properties:
        jobId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The job's ID.
    GetAnnotationImportResponse:
      type: object
      required:
      - id
      - destinationName
      - roleArn
      - status
      - statusMessage
      - creationTime
      - updateTime
      - completionTime
      - items
      - runLeftNormalization
      - formatOptions
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The job's ID.
        destinationName:
          allOf:
          - $ref: '#/components/schemas/StoreName'
          - description: The job's destination annotation store.
        roleArn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: The job's service role ARN.
        status:
          allOf:
          - $ref: '#/components/schemas/JobStatus'
          - description: The job's status.
        statusMessage:
          allOf:
          - $ref: '#/components/schemas/JobStatusMsg'
          - description: The job's status message.
        creationTime:
          allOf:
          - $ref: '#/components/schemas/CreationTime'
          - description: When the job was created.
        updateTime:
          allOf:
          - $ref: '#/components/schemas/UpdateTime'
          - description: When the job was updated.
        completionTime:
          allOf:
          - $ref: '#/components/schemas/CompletionTime'
          - description: When the job completed.
        items:
          allOf:
          - $ref: '#/components/schemas/AnnotationImportItemDetails'
          - description: The job's imported items.
        runLeftNormalization:
          allOf:
          - $ref: '#/components/schemas/RunLeftNormalization'
          - description: The job's left normalization setting.
        formatOptions:
          $ref: '#/components/schemas/FormatOptions'
        annotationFields:
          allOf:
          - $ref: '#/components/schemas/AnnotationFieldMap'
          - description: ' The annotation schema generated by the parsed annotation data. '
    String:
      type: string
    StartVariantImportResponse:
      type: object
      required:
      - jobId
      properties:
        jobId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The job's ID.
    EscapeChar:
      type: string
      minLength: 1
      maxLength: 1
    VariantImportJobItem:
      type: object
      required:
      - id
      - destinationName
