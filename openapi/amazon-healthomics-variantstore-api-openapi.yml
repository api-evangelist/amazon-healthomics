  variables:
    region:
      description: The AWS region
      enum:
      - cn-north-1
      - cn-northwest-1
      default: cn-north-1
  description: The Amazon Omics endpoint for China (Beijing) and China (Ningxia)
- url: https://omics.{region}.amazonaws.com.cn
  variables:
    region:
      description: The AWS region
      enum:
      - cn-north-1
      - cn-northwest-1
      default: cn-north-1
  description: The Amazon Omics endpoint for China (Beijing) and China (Ningxia)
security:
- hmac: []
tags:
- name: VariantStore
paths:
  /variantStore:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateVariantStore
      description: Creates a variant store.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVariantStoreResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ServiceQuotaExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceQuotaExceededException'
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '483':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '484':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
        '485':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '486':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reference
              properties:
                reference:
                  description: A genome reference.
                  type: object
                  properties:
                    referenceArn:
                      allOf:
                      - $ref: '#/components/schemas/ReferenceArn'
                      - description: The reference's ARN.
                name:
                  description: A name for the store.
                  type: string
                  pattern: ([a-z]){1}([a-z0-9_]){2,254}
                description:
                  description: A description for the store.
                  type: string
                  minLength: 0
                  maxLength: 500
                tags:
                  description: Tags for the store.
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/TagValue'
                sseConfig:
                  description: Server-side encryption (SSE) settings for a store.
                  type: object
                  properties:
                    type:
                      allOf:
                      - $ref: '#/components/schemas/EncryptionType'
                      - description: The encryption type.
                    keyArn:
                      allOf:
                      - $ref: '#/components/schemas/SseConfigKeyArnString'
                      - description: An encryption key ARN.
      summary: Amazon HealthOmics Create Variant Store
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - VariantStore
  /variantStore/{name}:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    delete:
      operationId: DeleteVariantStore
      description: Deletes a variant store.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteVariantStoreResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '483':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
        '484':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '485':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      parameters:
      - name: name
        in: path
        required: true
        description: The store's name.
        schema:
          type: string
      - name: force
        in: query
        required: false
        description: Whether to force deletion.
        schema:
          type: boolean
      summary: Amazon HealthOmics Delete Variant Store
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - VariantStore
    get:
      operationId: GetVariantStore
      description: Gets information about a variant store.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVariantStoreResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '484':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      parameters:
      - name: name
        in: path
        required: true
        description: The store's name.
        schema:
          type: string
      summary: Amazon HealthOmics Get Variant Store
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - VariantStore
    post:
      operationId: UpdateVariantStore
      description: Updates a variant store.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateVariantStoreResponse'
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '484':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
      parameters:
      - name: name
        in: path
        required: true
        description: A name for the store.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  description: A description for the store.
                  type: string
                  minLength: 0
                  maxLength: 500
      summary: Amazon HealthOmics Update Variant Store
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - VariantStore
components:
  schemas:
    Arn:
      type: string
      pattern: 'arn:([^: ]*):([^: ]*):([^: ]*):([0-9]{12}):([^: ]*)'
      minLength: 20
      maxLength: 2048
    ResourceNotFoundException: {}
    UpdateVariantStoreResponse:
      type: object
      required:
      - id
      - reference
      - status
      - name
      - description
      - creationTime
      - updateTime
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The store's ID.
        reference:
          allOf:
          - $ref: '#/components/schemas/ReferenceItem'
          - description: The store's genome reference.
        status:
          allOf:
          - $ref: '#/components/schemas/StoreStatus'
          - description: The store's status.
        name:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The store's name.
        description:
          allOf:
          - $ref: '#/components/schemas/StoreDescription'
          - description: The store's description.
        creationTime:
          allOf:
          - $ref: '#/components/schemas/CreationTime'
          - description: When the store was created.
        updateTime:
          allOf:
          - $ref: '#/components/schemas/UpdateTime'
          - description: When the store was updated.
    CreationTime:
      type: string
      format: date-time
    ConflictException: {}
    StoreDescription:
      type: string
      minLength: 0
      maxLength: 500
    ReferenceArn:
      type: string
      pattern: arn:.+
      minLength: 1
      maxLength: 127
    ReferenceItem:
      type: object
      properties:
        referenceArn:
          allOf:
          - $ref: '#/components/schemas/ReferenceArn'
          - description: The reference's ARN.
      description: A genome reference.
    DeleteVariantStoreResponse:
      type: object
      required:
      - status
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/StoreStatus'
          - description: The store's status.
    ResourceId:
      type: string
      pattern: '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'
    TagMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/TagValue'
    TagValue:
      type: string
      minLength: 0
      maxLength: 256
    StoreStatus:
      type: string
      enum:
      - CREATING
      - UPDATING
      - DELETING
      - ACTIVE
      - FAILED
    ThrottlingException: {}
    EncryptionType:
      type: string
      enum:
      - KMS
    GetVariantStoreResponse:
      type: object
      required:
      - id
      - reference
      - status
      - storeArn
      - name
      - description
      - sseConfig
      - creationTime
      - updateTime
      - tags
      - statusMessage
      - storeSizeBytes
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The store's ID.
        reference:
          allOf:
          - $ref: '#/components/schemas/ReferenceItem'
          - description: The store's genome reference.
        status:
          allOf:
          - $ref: '#/components/schemas/StoreStatus'
          - description: The store's status.
        storeArn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: The store's ARN.
        name:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The store's name.
        description:
          allOf:
          - $ref: '#/components/schemas/StoreDescription'
          - description: The store's description.
        sseConfig:
          allOf:
          - $ref: '#/components/schemas/SseConfig'
          - description: The store's server-side encryption (SSE) settings.
        creationTime:
          allOf:
          - $ref: '#/components/schemas/CreationTime'
          - description: When the store was created.
        updateTime:
          allOf:
          - $ref: '#/components/schemas/UpdateTime'
          - description: When the store was updated.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagMap'
          - description: The store's tags.
        statusMessage:
          allOf:
          - $ref: '#/components/schemas/StatusMessage'
          - description: The store's status message.
        storeSizeBytes:
          allOf:
          - $ref: '#/components/schemas/Long'
          - description: The store's size in bytes.
    String:
      type: string
    StatusMessage:
      type: string
      minLength: 0
      maxLength: 1000
    SseConfig:
      type: object
      required:
      - type
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/EncryptionType'
          - description: The encryption type.
        keyArn:
          allOf:
          - $ref: '#/components/schemas/SseConfigKeyArnString'
          - description: An encryption key ARN.
      description: Server-side encryption (SSE) settings for a store.
    ValidationException: {}
    SseConfigKeyArnString:
      type: string
      pattern: '.*arn:([^: ]*):([^: ]*):([^: ]*):([0-9]{12}):([^: ]*).*'
      minLength: 20
      maxLength: 2048
    UpdateTime:
      type: string
      format: date-time
    CreateVariantStoreResponse:
      type: object
      required:
      - id
      - status
      - name
      - creationTime
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: The store's ID.
        reference:
          allOf:
          - $ref: '#/components/schemas/ReferenceItem'
          - description: The store's genome reference.
        status:
          allOf:
          - $ref: '#/components/schemas/StoreStatus'
          - description: The store's status.
        name:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The store's name.
        creationTime:
          allOf:
          - $ref: '#/components/schemas/CreationTime'
          - description: When the store was created.
    ServiceQuotaExceededException: {}
    AccessDeniedException: {}
    InternalServerException: {}
    Long:
      type: integer
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/omics/
x-hasEquivalentPaths: true
