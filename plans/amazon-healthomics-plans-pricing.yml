rate_limit_statements:
- Tasks are billed in increments of 1 second; However, there is a minimum billing threshold of 60 seconds
  per task.
- Data stored in AWS HealthOmics data stores is charged for a minimum storage duration of 30 days
- Static run storage can be provisioned in sizes of 1,200 GiB, 2,400 GiB, and additional increments of
  2,400 GiB, with a minimum size of 1,200 GiB.
- You can allocate additional ephemeral storage to your workflow tasks, up to 3,072 GiB.
